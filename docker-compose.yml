services:
  mysql:
    image: mysql:8.0
    container_name: creafolio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: creafolio_db
      MYSQL_USER: creafolio_user
      MYSQL_PASSWORD: creafolio_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
